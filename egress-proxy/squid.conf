# Allow-listing forward proxy: the ONLY way the worker reaches the internet.
# Worker sets EGRESS_PROXY=http://egress-proxy:3128 (web search) and optionally
# NTFY_PROXY=http://egress-proxy:3128 (push notifications via ntfy.sh).
# Enforced by egress-proxy/firewall.sh: without it the worker could still go around the proxy.
http_port 3128

# HTTPS (CONNECT) only, port 443 only, to these hosts only. Add a host here ONLY if you use it.
acl allowed_hosts dstdomain api.search.brave.com
# Ardea Pro / MSP licence check (once a day; only the licence key is sent, never alert data)
acl allowed_hosts dstdomain api.polar.sh
# Ardea Pro / MSP playbook pack updates (Settings -> Playbook pack); only the licence key is sent
acl allowed_hosts dstdomain packs.ardeasecurity.com
# acl allowed_hosts dstdomain sandbox-api.polar.sh   # only while testing a sandbox build (release.py set-store --sandbox)
# acl allowed_hosts dstdomain ntfy.sh                 # if NOTIFY_CHANNELS includes ntfy with ntfy.sh
# acl allowed_hosts dstdomain hooks.slack.com         # slack
# acl allowed_hosts dstdomain .logic.azure.com        # teams (Workflows webhooks)
# acl allowed_hosts dstdomain .atlassian.net          # jira cloud
# acl allowed_hosts dstdomain www.googleapis.com      # legacy Google CSE, stops working 2027-01-01
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed_hosts
http_access deny all

# Never cache; the DB table outbound_requests is the query audit log. Squid only sees host names (TLS).
cache deny all
access_log stdio:/dev/stdout
