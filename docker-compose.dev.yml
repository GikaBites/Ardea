# Dev overrides: live source mounts + DB port on localhost.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  db:
    ports: ["127.0.0.1:5432:5432"]
    networks: [internal, frontend]
  fetcher:   { volumes: ["./fetcher:/app"] }
  worker:    { volumes: ["./worker:/app"] }
  publisher: { volumes: ["./publisher:/app"] }
